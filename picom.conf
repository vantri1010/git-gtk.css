#################################
# Picom 12.5 - XFCE/X11
# Target: Intel Core i3-1215U / Intel UHD / 8 GB RAM
# Chiến lược: trong suốt kiểu opacity, KHÔNG blur.
# Các dòng đổi so với bản gốc có ghi chú "# [ĐỔI]" hoặc "# [MỚI]"
#################################

#################################
# Backend / rendering
#################################
backend = "egl";
vsync = true;
use-damage = true;

# [MỚI] group_focused chỉ hoạt động khi có 2 dòng này.
# Dialog/popup của cùng một app được coi là "đang focus" cùng cửa sổ chính.
detect-transient = true;
detect-client-leader = true;

# [MỚI] xfwm4 không chuyển _NET_WM_WINDOW_OPACITY từ client sang frame.
detect-client-opacity = true;

#################################
# Corners
#################################
corner-radius = 10;

#################################
# Shadows
# Quy tắc: offset = -radius => bóng căn giữa. Lệch thêm 4px xuống dưới.
#################################
shadow = true;
shadow-radius = 16;           # [ĐỔI] 10 -> 16: mềm hơn
shadow-opacity = 0.35;        # [ĐỔI]
shadow-offset-x = -16;        # [ĐỔI] căn giữa theo trục ngang
shadow-offset-y = -12;        # [ĐỔI] lệch 4px xuống dưới

#################################
# Fading
#################################
fading = true;
fade-in-step = 0.07;          # [ĐỔI] ~120ms thay vì ~200ms
fade-out-step = 0.07;
fade-delta = 8;

#################################
# Transparency
# frame-opacity nhân với opacity của cửa sổ:
#   focus 1.0 * 0.95 = 0.95 | mất focus 0.92 * 0.95 ≈ 0.87
# [ĐỔI] 0.90 -> 0.95: titlebar (có chữ + nút) luôn đặc hơn thân cửa sổ một chút,
# đọc rõ hơn khi không có blur. Muốn như cũ: đặt lại 0.90.
#################################
frame-opacity = 0.95;

#################################
# Blur: TẮT (giữ như cũ)
#
# blur: {
#   method = "dual_kawase";
#   strength = 3;
# };
# blur-background = true;
#################################

#################################
# Window rules
# Khớp theo thứ tự; với cùng một option, RULE SAU THẮNG.
# => rule chung ở trên, rule cụ thể ở dưới.
#################################
rules = (
  # ---- Focus: giữ nguyên cách cũ (opacity), tôn trọng _NET_WM_WINDOW_OPACITY ----
  {
    match = "(focused || group_focused || wmwin || override_redirect) && !_NET_WM_WINDOW_OPACITY";
    opacity = 1.0;
  },
  {
    match = "!focused && !group_focused && !wmwin && !override_redirect && !_NET_WM_WINDOW_OPACITY";
    opacity = 0.92;
  },

  # [MỚI] Panel/desktop/splash không phải "cửa sổ mất focus": giữ đặc 100%.
  # (Rules không còn tự coi các wintype này là focused như wintypes cũ.)
  {
    match = "window_type = 'dock' || window_type = 'desktop' || window_type = 'splash'";
    opacity = 1.0;
  },

  # ---- Opacity theo ứng dụng ----
  { match = "class_g ?= 'firefox'"; opacity = 1.00; },
  { match = "class_g ?= 'google-chrome'"; opacity = 1.00; },
  { match = "class_g ?= 'code'"; opacity = 1.00; },
  { match = "class_g ?= 'mpv' || class_g ?= 'vlc'"; opacity = 1.00; },   # [MỚI] video không nên bị mờ khi mất focus
  { match = "class_g ?= 'thunar'"; opacity = 0.95; },
  { match = "class_g ?= 'conky'"; opacity = 1.00; },

  # [MỚI] Terminal theo bậc: focus 0.90, mất focus 0.82 (ghi đè rule ngay trước nó)
  { match = "class_g ?= 'xfce4-terminal'"; opacity = 0.90; },
  { match = "class_g ?= 'xfce4-terminal' && !focused && !group_focused"; opacity = 0.82; },

  # ---- Window-type ----
  { match = "window_type = 'tooltip'"; opacity = 0.90; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.95; },

  # ---- Rounded-corner exclusions ----
  { match = "fullscreen"; corner-radius = 0; },
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Xfce4-panel' || class_g = 'Xfce4-notifyd' || class_g = 'Conky' || class_g = 'Polybar' || class_g = 'Plank' || name = 'Notification'";
    corner-radius = 0;
  },

  # ---- Shadow exclusions ----
  {
    match = "window_type = 'dock' || window_type = 'desktop' || window_type = 'dnd' || class_g = 'Conky' || class_g = 'Polybar' || class_g = 'Xfce4-panel' || class_g = 'Xfce4-notifyd' || class_g = 'Wrapper-2.0' || class_g = 'Cairo-clock' || class_g = 'slop' || name = 'Notification' || _GTK_FRAME_EXTENTS@";
    shadow = false;
  },

  # [MỚI] Bóng của cửa sổ khác không được đè lên panel.
  { match = "window_type = 'dock'"; clip-shadow-above = true; },

  # ---- Fade exclusions ----
  { match = "class_g = 'slop'"; fade = false; },

  # [MỚI] Menu hiện/tắt tức thì cho cảm giác nhanh.
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'combo' || window_type = 'menu'"; fade = false; },

  # ---- [THỬ NGHIỆM] Viền sáng theo focus: bóng ánh xanh cho cửa sổ đang focus ----
  { match = "focused && !fullscreen"; shadow-color = "#4f8cff"; },

  # ---- [THỬ NGHIỆM] Animation mở/đóng (scale + fade) ----
  # Chỉ áp cho cửa sổ normal/dialog để không động vào menu, slop, panel.
  {
    match = "window_type = 'normal' || window_type = 'dialog'";
    animations = (
      { triggers = ["open", "show"]; preset = "appear"; scale = 0.94; duration = 0.14; },
      { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.94; duration = 0.12; }
    );
  }
);
