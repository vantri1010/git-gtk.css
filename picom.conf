#################################
# Picom 12.5 - XFCE/X11
# Target: Intel Core i3-1215U / Intel UHD / 8 GB RAM
#################################

#################################
# Backend / rendering
#################################
backend = "egl";
vsync = true;
use-damage = true;

# Recommended by Picom for GLX; useful when blur is disabled.
# glx-no-stencil = true;

# Optional performance tweak.
# Enable only if it is stable on your Intel/Mesa driver:
# glx-no-rebind-pixmap = true;

# Keep Picom's default frame pacing.
# Do not use no-frame-pacing unless you are troubleshooting stutter.

#################################
# Corners
#################################
corner-radius = 10;

#################################
# Shadows
#################################
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.40;
shadow-offset-x = -6;
shadow-offset-y = -6;

#################################
# Fading
#################################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;

#################################
# Transparency
#################################
# Keep frame opacity. Per-window opacity is handled below with rules.
frame-opacity = 0.90;

#################################
# Window rules
#
# Picom 12.5 recommends rules instead of the older:
# opacity-rule, shadow-exclude, fade-exclude,
# rounded-corners-exclude and wintypes.
#################################
rules = (
  # Preserve the old inactive-opacity behavior without overriding
  # applications that explicitly set _NET_WM_WINDOW_OPACITY.
  {
    match = "(focused || group_focused || wmwin || override_redirect) && !_NET_WM_WINDOW_OPACITY";
    opacity = 1.0;
  },
  {
    match = "!focused && !group_focused && !wmwin && !override_redirect && !_NET_WM_WINDOW_OPACITY";
    opacity = 0.92;
  },

  # Preserve application-specific opacity rules.
  { match = "class_g ?= 'firefox'"; opacity = 1.00; },
  { match = "class_g ?= 'google-chrome'"; opacity = 1.00; },
  { match = "class_g ?= 'code'"; opacity = 1.00; },
  { match = "class_g ?= 'thunar'"; opacity = 0.95; },
  { match = "class_g ?= 'xfce4-terminal'"; opacity = 0.90; },
  { match = "class_g ?= 'conky'"; opacity = 1.00; },

  # Window-type behavior formerly handled by wintypes.
  { match = "window_type = 'tooltip'"; opacity = 0.90; full-shadow = false; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.95; },

  # Rounded-corner exclusions.
  { match = "fullscreen"; corner-radius = 0; },
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Xfce4-panel' || class_g = 'Xfce4-notifyd' || class_g = 'Conky' || class_g = 'Polybar' || class_g = 'Plank' || name = 'Notification'";
    corner-radius = 0;
  },

  # Shadow exclusions.
  {
    match = "window_type = 'dock' || window_type = 'desktop' || window_type = 'dnd' || class_g = 'Conky' || class_g = 'Polybar' || class_g = 'Xfce4-panel' || class_g = 'Xfce4-notifyd' || class_g = 'Wrapper-2.0' || class_g = 'Cairo-clock' || class_g = 'slop' || name = 'Notification' || _GTK_FRAME_EXTENTS@";
    shadow = false;
  },

  # Slop selection overlay should appear instantly.
  { match = "class_g = 'slop'"; fade = false; }
);

#################################
# Blur
#
# Disabled intentionally for this 8 GB Intel iGPU setup.
# Picom 12.5 documents background blur as performance-heavy.
#
# If you later enable blur, use the modern section:
#
# blur: {
#   method = "dual_kawase";
#   strength = 3;
# };
# blur-background = true;
#################################
